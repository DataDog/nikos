---
dependency:
  name: galaxy
driver:
  name: vagrant
platforms:
  - name: amzn2
    box: gbailey/amzn2
    memory: 512
    cpus: 1
provisioner:
  name: ansible
  env:
    TEST_TYPE: "container"
    NIKOS_PREFIX: sudo docker exec -ti debian
  inventory:
    host_vars:
      amzn2:
        ansible_python_interpreter: /usr/bin/python3.9
  playbooks:
    converge: ../resources/playbooks/converge.yml
    verify: ../resources/playbooks/verify.yml
verifier:
  name: ansible
