---
# AL2023 ships with Python 3.9 by default — no bootstrap needed

- name: Prepare
  hosts: all
  tasks:
    - name: Install docker
      shell: dnf install -y docker
      become: true

    - name: Install docker-py
      shell: 'pip3 install docker'
      become: true

    - name: Start docker
      service:
        name: docker
        state: started
      become: true
