---
- name: Bootstrap Python 3.9
  hosts: all
  gather_facts: false
  tasks:
    - name: Install Python 3.9 on AlmaLinux 8
      raw: dnf install -y python39
      become: true
      when: inventory_hostname == 'almalinux8'

- name: Prepare
  hosts: all
  tasks:
    - name: Disable SElinux
      shell: setenforce 0
      become: true

    - name: Set up Docker repository
      get_url:
        url: https://download.docker.com/linux/centos/docker-ce.repo
        dest: /etc/yum.repos.d/docker-ce.repo
      become: true

    - name: Find all repo files
      find:
        paths: /etc/yum.repos.d/
        patterns: "CentOS*.repo"
      become: true
      register: repos
      when: ansible_distribution_major_version > '7'

    - name: Comment out mirrorlists
      replace:
        path: "{{ item.path }}"
        regexp: "mirrorlist"
        replace: "#mirrorlist"
      become: true
      with_items: "{{ repos.files }}"
      when: ansible_distribution_major_version > '7'

    - name: Use vault instead of mirror
      replace:
        path: "{{ item.path }}"
        regexp: "#baseurl=http://mirror.centos.org"
        replace: "baseurl=http://vault.centos.org"
      become: true
      with_items: "{{ repos.files }}"
      when: ansible_distribution_major_version > '7'

    - name: Install Docker and docker-py
      shell: |
        yum install -y libseccomp docker-ce docker-ce-cli containerd.io
        yum install -y python3-pip
        pip3 install docker
      become: true

    - name: Start docker
      service:
        name: docker
        state: started
      become: true
