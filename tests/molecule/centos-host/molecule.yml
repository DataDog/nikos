---
dependency:
  name: galaxy
driver:
  name: vagrant
  provider:
    name: libvirt
platforms:
  - name: almalinux9
    box: almalinux/9
    memory: 512
    cpus: 1
  - name: almalinux8
    box: almalinux/8
    memory: 512
    cpus: 1
provisioner:
  name: ansible
  inventory:
    host_vars:
      almalinux9:
        ansible_python_interpreter: /usr/bin/python3
      almalinux8:
        ansible_python_interpreter: /usr/bin/python3.9
  env:
    TEST_TYPE: 'host'
  playbooks:
    converge: ../resources/playbooks/converge.yml
    verify: ../resources/playbooks/verify.yml
verifier:
  name: ansible
