---
- name: Bootstrap Python 3.9
  hosts: all
  gather_facts: false
  tasks:
    - name: Install Python 3.9 on CentOS 7 via EPEL
      raw: |
        sed -i 's/mirrorlist=/#mirrorlist=/g' /etc/yum.repos.d/CentOS-*.repo
        sed -i 's|#baseurl=http://mirror.centos.org|baseurl=http://vault.centos.org|g' /etc/yum.repos.d/CentOS-*.repo
        yum install -y epel-release && yum install -y python39
      become: true
      when: inventory_hostname == 'centos7'

    - name: Install Python 3.9 on AlmaLinux 8
      raw: dnf install -y python39
      become: true
      when: inventory_hostname == 'almalinux8'
