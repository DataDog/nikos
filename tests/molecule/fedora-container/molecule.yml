---
dependency:
  name: galaxy
driver:
  name: vagrant
  provider:
    name: libvirt
platforms:
  - name: fedora39
    box: generic/fedora39
    memory: 512
    cpus: 1
  - name: fedora40
    box: generic/fedora40
    memory: 512
    cpus: 1
  - name: fedora41
    box: generic/fedora41
    memory: 512
    cpus: 1
provisioner:
  name: ansible
  env:
    TEST_TYPE: 'container'
    NIKOS_PREFIX: sudo docker exec -ti debian
  playbooks:
    converge: ../resources/playbooks/converge.yml
    verify: ../resources/playbooks/verify.yml
verifier:
  name: ansible
