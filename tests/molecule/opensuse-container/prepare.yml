---
- name: Bootstrap Python 3.11
  hosts: all
  gather_facts: false
  tasks:
    - name: Install Python 3.11
      raw: zypper --non-interactive install python311
      become: true

- name: Prepare
  hosts: all
  tasks:
  - name: Install rsync
    package:
      name: rsync
      state: present
    become: true

  - name: Install docker
    package:
      name: docker
      state: present
    become: true

  - name: Install docker-py
    package:
      name: python3-docker
      state: present
    become: true
    when: ansible_distribution_major_version == '15'

  - name: Install docker-py
    package:
      name: python-docker-py
      state: present
    become: true
    when: ansible_distribution_major_version == '42'

  - name: Start docker
    service:
      name: docker
      state: started
    become: true

