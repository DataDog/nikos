---
- name: Bootstrap Python 3.11
  hosts: all
  gather_facts: false
  tasks:
    - name: Install Python 3.11
      raw: zypper --non-interactive install python311
      become: true

- name: Prepare
  hosts: all
  tasks:
  - name: Install rsync
    package:
      name: rsync
      state: present
    become: true
