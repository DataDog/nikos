---
- name: Bootstrap Python 3.9
  hosts: all
  gather_facts: false
  tasks:
    - name: Install Python 3.9
      raw: dnf install -y python39
      become: true

- name: Prepare
  hosts: all
  tasks:
  - name: Install yum-utils and Docker
    shell: |
      dnf install -y yum-utils
      yum-config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
      dnf install -y docker-ce docker-ce-cli containerd.io
      dnf install -y python3-pip
      pip3 install docker
      python3.9 -m ensurepip && python3.9 -m pip install docker
    become: true

  - name: Start docker
    service:
      name: docker
      state: started
    become: true
