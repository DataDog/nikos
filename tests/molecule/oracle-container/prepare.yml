---
- name: Bootstrap Python 3.9
  hosts: all
  gather_facts: false
  tasks:
    - name: Install Python 3.9
      raw: dnf install -y python39
      become: true

- name: Prepare
  hosts: all
  tasks:
  - name: Install yum-utils
    package:
      name: yum-utils
    become: true

  - name: Set up Docker CE repository
    shell: yum-config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
    become: true

  - name: Install Docker
    package:
      name:
        - docker-ce
        - docker-ce-cli
        - containerd.io
      state: latest
    become: true

  - name: Install pip
    package:
      name: python3-pip
    become: true

  - name: Install docker-py
    shell: 'pip3 install docker'
    become: true

  - name: Start docker
    service:
      name: docker
      state: started
    become: true
