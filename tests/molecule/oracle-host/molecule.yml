---
dependency:
  name: galaxy
driver:
  name: vagrant
  provider:
    name: libvirt
platforms:
  - name: oracle8
    box: generic/oracle8
    memory: 512
    cpus: 1
provisioner:
  name: ansible
  inventory:
    host_vars:
      oracle8:
        ansible_python_interpreter: /usr/bin/python3.9
  env:
    TEST_TYPE: 'host'
  playbooks:
    converge: ../resources/playbooks/converge.yml
    verify: ../resources/playbooks/verify.yml
verifier:
  name: ansible
